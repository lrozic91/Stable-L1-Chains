<style>
/* Layout: tamni header s navigacijom, veliki broj + graf ukupne ponude, ispod tri kartice (tamna / svijetla / svijetla), zatim povijest i regulativa */
:root{
  --bg:#f4f6f1; --paper:#ffffff; --ink:#121410; --ink-2:#5d6358; --line:#e3e7de;
  --bar:#121410; --bar-ink:#e9eee4; --bar-ink-2:#8d9487; --bar-line:#2a2e26;
  --lime:#7fd321; --lime-soft:rgba(127,211,33,.14); --lime-ink:#3f7a06;
  --grey:#b9beb4; --red:#d8372f; --amber:#e6b23a;
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0c0a; --paper:#151713; --ink:#eef2ea; --ink-2:#9aa293; --line:#272b23;
  --bar:#050605; --bar-ink:#e9eee4; --bar-ink-2:#80887a; --bar-line:#22261f;
  --lime:#93e637; --lime-soft:rgba(147,230,55,.14); --lime-ink:#a6ef55; --grey:#5c6257; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c0a; --paper:#151713; --ink:#eef2ea; --ink-2:#9aa293; --line:#272b23;
  --bar:#050605; --bar-ink:#e9eee4; --bar-ink-2:#80887a; --bar-line:#22261f;
  --lime:#93e637; --lime-soft:rgba(147,230,55,.14); --lime-ink:#a6ef55; --grey:#5c6257; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.shell{background:var(--paper);border:1px solid var(--line);overflow:hidden}
/* header */
header{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:28px;padding:14px 24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em}
.logo svg{display:block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--bar-ink-2);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:2px}
nav a:hover{color:var(--bar-ink)}
nav a[aria-current="page"]{color:var(--bar-ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--lime)}
nav a.soon{opacity:.45;pointer-events:none}
.hdr-right{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--bar-ink-2);border:1px solid var(--bar-line);padding:7px 12px}
/* hero */
.hero{padding:28px 28px 0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big .num{font-size:clamp(48px,9vw,92px);font-weight:300;letter-spacing:-.03em;line-height:1}
.big .num span{color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:400}
.pill{font-family:var(--f-mono);font-size:11px;background:var(--lime);color:#122100;padding:2px 8px;border-radius:99px;font-weight:500;align-self:flex-start;margin-top:10px}
.coin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff}
.sub{color:var(--ink-2);margin:10px 0 0;max-width:62ch}
.seg{display:flex;border:1px solid var(--line)}
.seg button{font:inherit;font-size:13px;background:none;border:0;border-right:1px solid var(--line);padding:6px 12px;color:var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,nav a:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.chart{padding:8px 0 0;position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;padding:0 28px 14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:99px;white-space:nowrap;transform:translate(-50%,-130%)}
/* cards */
.cards{display:grid;grid-template-columns:1.15fr 1fr 1fr;border-top:1px solid var(--line)}
.card{padding:22px 24px;min-width:0}
.card+.card{border-left:1px solid var(--line)}
.card.dark{background:var(--bar);color:var(--bar-ink)}
.card h3{font-weight:400;font-size:20px;margin:0 0 12px}
.small{font-size:12px;color:var(--ink-2)}
.dark .small{color:var(--bar-ink-2)}
.dots{display:flex;gap:14px;font-size:12px;margin-bottom:14px;flex-wrap:wrap}
.dots b{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.stack{display:flex;height:34px;gap:2px}
.stack div{height:100%}
.rlist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;font-size:13px}
.rlist li{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.dom{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:end}
.dom .v{font-size:20px;font-variant-numeric:tabular-nums}
.dom .bars{height:64px;margin-top:6px;background-image:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 4px)}
.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv span{font-size:12px;color:var(--ink-2)}
.kv strong{font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;text-align:right}
/* body sections */
.sec{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.sec>div{padding:26px 28px;min-width:0}
.sec>div+div{border-left:1px solid var(--line)}
h2{font-weight:400;font-size:24px;margin:0 0 14px;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lime-ink);margin-bottom:6px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border-bottom:0}
.tl time{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:2px}
.tl p{margin:0;max-width:60ch}
.facts{display:grid;gap:12px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.st{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap;margin-top:3px}
.st.ok{background:var(--lime-soft);color:var(--lime-ink)}
.st.no{background:rgba(216,55,47,.12);color:var(--red)}
.st.mid{background:rgba(230,178,58,.16);color:#a87a12}
.fact p{margin:0}
.chain{background:var(--bar);color:var(--bar-ink);padding:26px 28px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;border-top:1px solid var(--line)}
.chain h2{color:var(--bar-ink)}
.chain p{color:var(--bar-ink-2);max-width:62ch;margin:0 0 10px}
.chain .kv div{border-color:var(--bar-line)}
.chain .kv span{color:var(--bar-ink-2)}
.chain .eyebrow{color:var(--lime)}
.src{padding:18px 28px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line)}
.src a{color:var(--ink-2)}
.src ul{margin:6px 0 0;padding-left:18px;columns:2;column-gap:28px}
@media (max-width:880px){
  .cards,.sec,.chain{grid-template-columns:1fr}
  .card+.card,.sec>div+div{border-left:0;border-top:1px solid var(--line)}
  .src ul{columns:1}
}
@media (max-width:520px){
  header{gap:12px;padding:12px 16px}.hdr-right{display:none}
  .hero,.legend,.sec>div,.chain,.src{padding-left:16px;padding-right:16px}.card{padding:18px 16px}
  .tl li{grid-template-columns:58px 1fr}
}
@media (prefers-reduced-motion:no-preference){.line-path{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw 1.2s ease-out}@keyframes draw{from{stroke-dashoffset:var(--len)}}}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);margin-right:6px;vertical-align:-1px}
.ldot.est{background:var(--paper)}
.verdict{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.vbig{font-size:54px;font-weight:300;line-height:1;color:var(--lime)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px}
.checks li{display:flex;gap:10px;align-items:center}
.ck{width:18px;height:18px;display:grid;place-items:center;font-size:11px;border-radius:2px}
.ck.y{background:var(--lime);color:#122100}.ck.n{background:var(--bar-line);color:var(--bar-ink-2)}
.para{margin:0 0 12px;max-width:62ch}
.vs{padding:20px 28px 26px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px 40px}
.vsrow{min-width:0}.vsl{font-size:14px;margin-bottom:8px}
.vsb{display:grid;grid-template-columns:52px 1fr 70px;gap:10px;align-items:center;font-size:12px;margin-bottom:5px}
.vsb .nm{color:var(--ink-2)}.vsb .val{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--line)}.track div{height:100%}
.tblwrap{overflow-x:auto;border-top:1px solid var(--line)}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.cmp th,.cmp td{text-align:left;padding:11px 28px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp thead th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.cmp tbody th{font-weight:500;width:24%}
.cmp tbody tr:hover{background:var(--lime-soft)}
@media (max-width:880px){.vs{grid-template-columns:1fr}}
@media (max-width:520px){.vs{padding-left:16px;padding-right:16px}.cmp th,.cmp td{padding:10px 16px}}
.hdr-end{margin-left:auto;display:flex;gap:10px;align-items:center}
.hdr-end .hdr-right{margin-left:0}
.lang{display:flex;border:1px solid var(--bar-line)}
.lang button{font:inherit;font-family:var(--f-mono);font-size:12px;background:none;border:0;color:var(--bar-ink-2);padding:7px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--lime);color:#122100}
.lang button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.strat-hero{padding-bottom:6px}
.sh1{font-weight:300;font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-.02em;margin:4px 0 0;max-width:20ch;text-wrap:balance}
.leaks{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:22px;border-top:1px solid var(--line)}
.leak{padding:22px 28px;min-width:0}.leak+.leak{border-left:1px solid var(--line)}
.lnum{font-size:clamp(40px,6vw,64px);font-weight:300;letter-spacing:-.03em;line-height:1.05;color:var(--ink);margin:6px 0 8px}
.leak p{margin:0;color:var(--ink-2);max-width:52ch}
.flowsec{padding:26px 28px}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.flowrow{min-width:0}.flowt{font-size:14px;margin-bottom:10px}
.stack.tall{height:44px}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.goalsec{padding:26px 28px;border-top:1px solid var(--line)}
.goalcols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.gh{font-weight:400;font-size:20px;margin:6px 0 12px}
.goals{display:grid;gap:10px}
.goal{border:1px solid var(--line);padding:14px 16px;min-width:0}
.goal h4{font-weight:500;font-size:15px;margin:8px 0 4px}
.goal p{margin:0;font-size:14px;color:var(--ink-2)}
.goal .st{display:inline-block}
.vsb.wide{grid-template-columns:120px 1fr 72px}
.scale{display:grid;gap:8px;margin-top:6px}
.quotes{display:grid;gap:16px}
.q{margin:0;padding-left:16px;border-left:2px solid var(--lime)}
.q blockquote{margin:0;font-size:18px;font-weight:300;line-height:1.35}
.q figcaption{font-size:12px;color:var(--ink-2);margin-top:6px}
.watch strong{font-size:14px!important;max-width:60%}
@media (max-width:880px){.leaks,.flows,.goalcols{grid-template-columns:1fr}.leak+.leak{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:520px){.leak,.flowsec,.goalsec{padding-left:16px;padding-right:16px}.vsb.wide{grid-template-columns:96px 1fr 60px}}
.refresh{font:inherit;font-size:12px;background:var(--lime);color:#122100;border:0;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.refresh:disabled{opacity:.6;cursor:progress}
.refresh:focus-visible{outline:2px solid var(--bar-ink);outline-offset:2px}
.rmsg{font-size:12px;color:var(--amber)}
@media (max-width:520px){.hdr-end{flex-wrap:wrap}}
header{gap:18px}
nav a{padding:6px 9px}
.hdr-right{font-size:11px;padding:7px 10px}
</style>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=v=>"$"+(v>=10?v.toFixed(0):v.toFixed(1)).replace(".",LANG==="en"?".":",")+"B";

function chartSVG(p,mode){
  const W=1000,H=330,L=0,R=58,T=20,B=34,iw=W-L-R,ih=H-T-B;
  const a=SUPPLY[p.key],b=SUPPLY[p.other];
  let sa=a,sb=b,max,ticks,lab;
  if(mode==="share"){sa=a.map((v,i)=>v/(a[i]+b[i])*100);sb=sa.map(v=>100-v);max=100;ticks=[0,25,50,75,100];lab=v=>v+"%";}
  else{max=200;ticks=[0,50,100,150,200];lab=v=>v+"B";}
  const x=i=>L+i*iw/(YEARS.length-1),y=v=>T+ih-v/max*ih;
  const path=s=>s.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=path(sa)+` L${x(sa.length-1)} ${T+ih} L${x(0)} ${T+ih} Z`;
  let g="";
  ticks.forEach(t=>{g+=`<line x1="${L}" x2="${L+iw}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="${t?'2 4':'0'}"/><text x="${W-6}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--ink-2)" font-family="JetBrains Mono,monospace">${lab(t)}</text>`});
  YEARS.forEach((yr,i)=>g+=`<text x="${x(i)}" y="${H-10}" text-anchor="${i===0?'start':i===YEARS.length-1?'end':'middle'}" font-size="12" fill="var(--ink-2)">${yr}</text>`);
  const last=sa.length-1,vl=mode==="share"?sa[last].toFixed(1).replace(".",LANG==="en"?".":",")+"%":fmt(sa[last]);
  // vertical hatch like the template
  let hatch="";for(let i=0;i<=120;i++){const xx=L+i*iw/120;hatch+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T+ih}" stroke="var(--lime)" stroke-opacity=".10"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr("supplyAria")(p.ticker,p.other.toUpperCase())}">
  <defs><clipPath id="ca"><path d="${area}"/></clipPath><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--lime)" stop-opacity=".22"/><stop offset="1" stop-color="var(--lime)" stop-opacity="0"/></linearGradient></defs>
  ${g}<path d="${area}" fill="url(#gf)"/><g clip-path="url(#ca)">${hatch}</g>
  <path d="${path(sb)}" fill="none" stroke="var(--ink)" stroke-width="1.4" opacity=".8"/>
  <path class="line-path" style="--len:2000" d="${path(sa)}" fill="none" stroke="var(--lime)" stroke-width="2.6" stroke-linejoin="round"/>
  <line x1="${x(last)}" x2="${x(last)}" y1="${y(sa[last])}" y2="${T+ih}" stroke="var(--ink)" stroke-width="2"/>
  <rect x="${x(last)-7}" y="${y(sa[last])-7}" width="14" height="14" transform="rotate(45 ${x(last)} ${y(sa[last])})" fill="var(--ink)"/>
  <circle cx="${x(last)}" cy="${y(sa[last])}" r="2.5" fill="var(--paper)"/>
  ${sa.map((v,i)=>`<rect class="hit" data-i="${i}" x="${x(i)-iw/(YEARS.length-1)/2}" y="${T}" width="${iw/(YEARS.length-1)}" height="${ih}" fill="transparent"/>`).join("")}
  </svg>`;
}

function fmtU(v,u){const s=v>=100?v.toFixed(0):v>=10?v.toFixed(1):v>=1?v.toFixed(2):v.toFixed(3);if(u==="$k"){const dc=LANG==="en"?".":",";return v>=1000?"$"+(v/1e3).toFixed(1).replace(".",dc)+"M":"$"+(v===0?"0":v>=100?v.toFixed(0):v.toFixed(1).replace(".",dc))+"k"}return "$"===u?"$"+s:(u==="k"?s.replace(".",LANG==="en"?".":",")+"k":"$"+s.replace(".",LANG==="en"?".":",")+"M")}
function fmtM(v,m){if(/^Trans/.test(m.label))return m.unit==="k"?v.toFixed(1).replace(".",LANG==="en"?".":",")+"k":v.toFixed(2).replace(".",LANG==="en"?".":",")+"M";return fmtU(v,m.unit)}

function seriesSVG(m){
  const W=1000,H=330,R=64,T=24,B=40,iw=W-R-24,ih=H-T-B,L=24,pts=m.pts,n=pts.length;
  const mx=Math.max(...pts.map(p=>p[1]));const step=[0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000][[0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000].findIndex(s=>mx/s<=4.5)]||500;
  const max=Math.ceil(mx/step)*step||1;const ticks=[];for(let t=0;t<=max+1e-9;t+=step)ticks.push(+t.toFixed(3));
  const x=i=>n===1?L+iw/2:L+i*iw/(n-1),y=v=>T+ih-v/max*ih;
  let g="";ticks.forEach(t=>g+=`<line x1="${L}" x2="${L+iw}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="${t?'2 4':'0'}"/><text x="${W-6}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--ink-2)" font-family="JetBrains Mono,monospace">${fmtM(t,m)}</text>`);
  const dense=n>12,show=i=>!dense||(n-1-i)%5===0;
  pts.forEach((p,i)=>{if(show(i))g+=`<text x="${x(i)}" y="${H-12}" text-anchor="${n>1&&i===0?'start':n>1&&i===n-1?'end':'middle'}" font-size="12" fill="var(--ink-2)">${esc(p[0])}</text>`});
  let segs="";for(let i=1;i<n;i++){const d=pts[i][2]||pts[i-1][2];segs+=`<line x1="${x(i-1)}" y1="${y(pts[i-1][1])}" x2="${x(i)}" y2="${y(pts[i][1])}" stroke="var(--lime)" stroke-width="2.6" stroke-linecap="round" ${d?'stroke-dasharray="6 6"':''}/>`;}
  const area=n>1?pts.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p[1])).join(" ")+` L${x(n-1)} ${T+ih} L${x(0)} ${T+ih} Z`:"";
  let dots="";pts.forEach((p,i)=>dots+=dense&&i<n-1?`<circle cx="${x(i)}" cy="${y(p[1])}" r="3" fill="var(--lime)" stroke="var(--ink)" stroke-width="1"/>`:`<circle cx="${x(i)}" cy="${y(p[1])}" r="5.5" fill="${p[2]?'var(--paper)':'var(--lime)'}" stroke="var(--ink)" stroke-width="1.6"/><text x="${x(i)}" y="${y(p[1])-12}" text-anchor="${n>1&&i===0?'start':n>1&&i===n-1?'end':'middle'}" font-size="12" font-family="JetBrains Mono,monospace" fill="var(--ink)">${p[2]?'~':''}${fmtM(p[1],m)}</text>`);
  const hits=pts.map((p,i)=>{const w=n===1?iw:iw/(n-1);return `<rect class="hit" data-i="${i}" x="${x(i)-w/2}" y="${T}" width="${w}" height="${ih}" fill="transparent"/>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)}"><defs><linearGradient id="gf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--lime)" stop-opacity=".2"/><stop offset="1" stop-color="var(--lime)" stop-opacity="0"/></linearGradient></defs>${g}${area?`<path d="${area}" fill="url(#gf2)"/>`:""}${segs}${dots}${hits}</svg>`;
}

function renderStrategy(){
  const S=STRAT[LANG];
  const flow=(title,parts,unit)=>{const tot=parts.reduce((a,p)=>a+p[1],0);return `<div class="flowrow"><div class="flowt">${title}</div>
    <div class="stack tall">${parts.map(p=>`<div title="${esc(p[0])}" style="flex:${p[1]};background:${p[2]}"></div>`).join("")}</div>
    <ul class="rlist">${parts.map(p=>`<li><span><b class="sw" style="background:${p[2]}"></b>${esc(p[0])}</span><span>$${(unit==="B"?p[1].toFixed(1):p[1].toFixed(1)).replace(".",LANG==="en"?".":",")}${unit} · ${(p[1]/tot*100).toFixed(0)}%</span></li>`).join("")}</ul></div>`};
  const goals=(name,list)=>`<div><h3 class="gh">${name}</h3><div class="goals">${list.map(g=>`<div class="goal"><span class="st ${g[0]==="ok"?"ok":g[0]==="no"?"no":"mid"}">${S.status[g[0]]}</span><h4>${esc(g[1])}</h4><p>${esc(g[2])}</p></div>`).join("")}</div></div>`;
  const smax=Math.max(...S.scale.map(s=>s[1]));
  document.getElementById("app").innerHTML=`
  <section class="hero strat-hero">
    <div><div class="eyebrow">${S.eyebrow}</div><h1 class="sh1">${S.title}</h1><p class="sub">${S.sub}</p></div>
  </section>
  <div class="leaks">
    <div class="leak"><div class="small">${S.leakT}</div><div class="lnum">${S.leakTnum}</div><p>${S.leakTtxt}</p></div>
    <div class="leak"><div class="small">${S.leakC}</div><div class="lnum">${S.leakCnum}</div><p>${S.leakCtxt}</p></div>
  </div>
  <p class="src" style="border-top:0;padding-top:0">${S.leakNote}</p>
  <section class="card dark flowsec">
    <h3>${S.flowH}</h3><p class="small" style="margin:-6px 0 18px">${S.flowSub}</p>
    <div class="flows">${flow(S.flowT,S.flowTparts,"B")}${flow(S.flowC,S.flowCparts,"M")}</div>
    <p class="para" style="color:var(--bar-ink-2);margin:18px 0 0">${S.flowWhy}</p>
  </section>
  <div class="tblwrap"><table class="cmp"><thead><tr><th>${S.linkH}</th><th>Stable → USDT</th><th>Arc → USDC</th></tr></thead><tbody>${S.linkRows.map(r=>`<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
  <section class="goalsec"><div class="eyebrow">${S.goalsH}</div><div class="goalcols">${goals("Tether · Stable",S.tGoals)}${goals("Circle · Arc",S.cGoals)}</div></section>
  <section class="sec">
    <div><div class="eyebrow">${S.scaleH}</div><h2>${S.scaleSub}</h2>
      <div class="scale">${S.scale.map(s=>`<div class="vsb wide"><span class="nm">${s[0]}</span><div class="track"><div style="width:${Math.max(s[1]/smax*100,0.5)}%;background:${s[2]}"></div></div><span class="val">$${(s[1]>=1?s[1].toFixed(1)+"B":(s[1]*1000).toFixed(0)+"M").replace(".",LANG==="en"?".":",")}</span></div>`).join("")}</div>
      <p class="small" style="margin:14px 0 0;max-width:62ch">${S.scaleNote}</p></div>
    <div><div class="eyebrow">${S.quotesH}</div>
      <div class="quotes">${S.quotes.map(q=>`<figure class="q"><blockquote>${esc(q[0])}</blockquote><figcaption>${esc(q[1])}</figcaption></figure>`).join("")}</div></div>
  </section>
  <section class="chain">
    <div><div class="eyebrow">${S.verdictH}</div>${S.verdict.map(v=>`<p>${esc(v)}</p>`).join("")}</div>
    <div><div class="eyebrow">${S.watchH}</div><div class="kv watch">${S.watch.map(w=>`<div><span>${esc(w[0])}</span><strong>${esc(w[1])}</strong></div>`).join("")}</div></div>
  </section>
  <div class="src">${S.srcH} <ul>${STRAT_SRC.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ul></div>`;
}

function stamp(iso,lang){const d=new Date(iso),p=x=>String(x).padStart(2,"0"),t=`${p(d.getHours())}:${p(d.getMinutes())}`;
  if(lang==="en")return `${d.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]} ${d.getFullYear()}, ${t}`;
  return `${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}. u ${t}`}
function dayLabel(day,lang){const [y,mo,da]=day.split("-").map(Number);return lang==="en"?`${da} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][mo-1]}`:`${da}. ${mo}.`}

    msg.textContent=LANG==="en"?"Could not refresh the data. Try again.":"Podaci se nisu mogli osvježiti. Pokušaj ponovno.";msg.hidden=false;

}

  const r=p.reserves,tot=r.parts.reduce((s,x)=>s+x[1],0);
  const other=p.other.toUpperCase();
  const share=[["USDT",DOM[0],"var(--lime)"],["USDC",DOM[1],"var(--amber)"],[tr("others"),DOM[2],"var(--red)"]];
  document.getElementById("app").innerHTML=`
  <section class="hero">
    <div>
      <div class="big"><div class="num">${p.num[0]}<span>${p.num[1]}</span></div><span class="pill">${p.pill}</span>
        <span class="tag"><span class="coin" style="background:${p.color}">${p.ticker==="USDT"?"₮":"$"}</span>${p.ticker} · ${p.company}</span></div>
      <p class="sub">${esc(p.sub)}</p>
    </div>
    <div class="seg" role="group" aria-label="${tr("chartAria")}">
      <button id="m-supply" aria-pressed="${mode==="supply"}">${tr("supply")}</button>
      <button id="m-share" aria-pressed="${mode==="share"}">${p.ticker} vs ${other} ${tr("share")}</button>
    </div>
  </section>
  <div class="chart" id="chart">${chartSVG(p,mode)}<div class="tip" id="tip" hidden></div></div>
  <div class="legend"><span><i style="background:var(--lime);height:3px"></i>${p.ticker}</span><span><i style="background:var(--ink)"></i>${other}</span><span>${tr("legendIssuer")}</span></div>

  <div class="cards">
    <div class="card dark">
      <h3>${r.title}</h3>
      <div class="dots">${r.parts.map(x=>`<span><b style="background:${x[2]}"></b>${esc(x[0])}</span>`).join("")}</div>
      <div class="stack">${r.parts.map(x=>`<div title="${esc(x[0])}" style="flex:${x[1]};background:${x[2]}"></div>`).join("")}</div>
      <ul class="rlist">${r.parts.map(x=>`<li><span>${esc(x[0])}</span><span>${"$"+x[1].toFixed(2).replace(".",LANG==="en"?".":",")+"B"} · ${(x[1]/tot*100).toFixed(1).replace(".",LANG==="en"?".":",")}%</span></li>`).join("")}
      ${(r.extra||[]).map(x=>`<li><span>${x[0]}</span><span>${x[1]}</span></li>`).join("")}</ul>
      <p class="small" style="margin:12px 0 0">${esc(r.note)}</p>
    </div>
    <div class="card">
      <h3>${tr("dominance")}</h3>
      <div class="dom">${share.map(s=>`<div><div class="small">${s[0]}</div><div class="v">${s[1]}%</div><div class="bars" style="color:${s[2]};height:${Math.max(10,s[1]*1.3)}px"></div></div>`).join("")}</div>
      <p class="small" style="margin:12px 0 0">${tr("domNote")}</p>
    </div>
    <div class="card">
      <h3>${tr("market")}</h3>
      <div class="kv">${p.market.map(m=>`<div><span>${m[0]}</span><strong>${m[1]}</strong></div>`).join("")}</div>
    </div>
  </div>

  <div class="sec">
    <div><div class="eyebrow">${tr("history")}</div><h2>${tr("howBorn")(p.company)}</h2>
      <ol class="tl">${p.hist.map(h=>`<li><time>${h[0]}</time><p>${esc(h[1])}</p></li>`).join("")}</ol></div>
    <div><div class="eyebrow">${tr("reg")}</div><h2>${tr("where")(p.ticker)}</h2>
      <div class="facts">${p.reg.map(f=>`<div class="fact"><span class="st ${f[0]}">${tr("st")[f[0]]}</span><p><strong style="font-weight:500">${f[1]}.</strong> ${esc(f[2])}</p></div>`).join("")}</div></div>
  </div>

  <section class="chain">
    <div><div class="eyebrow">${p.chain.eyebrow}</div><h2>${p.company} ${tr("and")} ${p.chain.name}</h2>${p.chain.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
    <div class="kv">${p.chain.kv.map(m=>`<div><span>${m[0]}</span><strong>${m[1]}</strong></div>`).join("")}</div>
  </section>

  <div class="src">${tr("sources")} <ul>${p.src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ul></div>`;

  document.getElementById("m-supply").onclick=()=>{mode="supply";render()};
  document.getElementById("m-share").onclick=()=>{mode="share";render()};
  const tip=document.getElementById("tip"),ch=document.getElementById("chart");
  ch.querySelectorAll(".hit").forEach(h=>{
    h.addEventListener("mouseenter",()=>{const i=+h.dataset.i,a=SUPPLY[p.key][i],b=SUPPLY[p.other][i];
      const v=mode==="share"?(a/(a+b)*100).toFixed(1).replace(".",LANG==="en"?".":",")+"%":fmt(a);
      const bb=h.getBoundingClientRect(),cb=ch.getBoundingClientRect();
      tip.textContent=`${YEARS[i]} · ${p.ticker} ${v}`;tip.style.left=(bb.left-cb.left+bb.width/2)+"px";tip.style.top="40px";tip.hidden=false;});
    h.addEventListener("mouseleave",()=>tip.hidden=true);
  });
  try{localStorage.setItem("izd-page",id)}catch(e){}
}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});
if(!location.hash){try{const s=localStorage.getItem("izd-page");if(s&&(PAGES[s]||CHAINS[s]||s==="usporedba"||s==="strategija"))history.replaceState(null,"","#"+s)}catch(e){}}
render();
</script>

</body>
</html>
